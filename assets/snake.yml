name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#6d28d9&color_dots=#ede9fe,#ddd6fe,#c4b5fd,#a78bfa,#7c3aed
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c4b5fd&color_dots=#2e1065,#4c1d95,#6d28d9,#8b5cf6,#c4b5fd

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
